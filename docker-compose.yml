x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_ML: ${INSTALL_ML:-1}
  env_file: .env
  environment:
    DATABASE_URL: postgres://docsense:docsense@db:5432/docsense
    REDIS_URL: redis://redis:6379/0
    CACHE_REDIS: "1"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
    SEED_DIR: /app/seed/demo_workspace
    LAYOUT_MODEL_PATH: /app/ml/models/layout-current.pt
  volumes:
    - media:/app/media
    - ./seed:/app/seed:ro
    - ./ml/models:/app/ml/models:ro
    - ./docs/eval-results:/docs/eval-results:ro   # shown on the Evaluation page
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: docsense, POSTGRES_PASSWORD: docsense, POSTGRES_DB: docsense }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsense"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    <<: *backend
    environment:
      DATABASE_URL: postgres://docsense:docsense@db:5432/docsense
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      SEED_DIR: /app/seed/demo_workspace
      LAYOUT_MODEL_PATH: /app/ml/models/layout-current.pt
      SEED_DEMO: "1"       # one command setup: migrate + seed the demo workspace on first start
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]
  worker:
    <<: *backend
    environment:
      DATABASE_URL: postgres://docsense:docsense@db:5432/docsense
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      SEED_DIR: /app/seed/demo_workspace
      LAYOUT_MODEL_PATH: /app/ml/models/layout-current.pt
      RUN_MIGRATIONS: "0"
    command: celery -A config worker -l info
    depends_on:
      api: { condition: service_started }
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes: [mlflow:/mlflow]
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    environment: { VITE_API_PROXY: "http://api:8000" }
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  media:
  mlflow:
