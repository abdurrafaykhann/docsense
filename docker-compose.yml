x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgres://docsense:docsense@db:5432/docsense
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: docsense, POSTGRES_PASSWORD: docsense, POSTGRES_DB: docsense }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsense"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    <<: *backend
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: celery -A config worker -l info
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes: [mlflow:/mlflow]
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    environment: { VITE_API_PROXY: "http://api:8000" }
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  media:
  mlflow:
